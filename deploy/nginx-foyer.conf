# /etc/nginx/sites-available/foyer  →  ln -s dans sites-enabled, puis : sudo certbot --nginx -d foyer.apps-reseau.fr
# Remplacer le domaine si besoin.
server {
    listen 80;
    server_name foyer.apps-reseau.fr;

    # Photos : le téléphone réduit déjà l'image, 16 Mo laisse de la marge.
    client_max_body_size 16M;

    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        # Indispensable : le serveur compare l'Origin à cet hôte (protection CSRF).
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
